[project]
name = "self-agent"
version = "0.1.0"
description = "自研智能体框架：deepagents + LangGraph 内核，集成无人机 MCP 资产"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.5",
    "langchain-mcp-adapters>=0.1.9",
    "langgraph-checkpoint-postgres==3.1.2",
    "langchain-openai>=0.3",
    "python-dotenv>=1.0",
    "langfuse>=4.14.4",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=5.0.0",
    "pypdf>=6.15.0",
    "croniter>=6.2.4",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
