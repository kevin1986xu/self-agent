<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>self-agent 管理台</title>
<style>
:root { --primary:#1f4e79; --bg:#f5f7fa; --card:#fff; --border:#e2e8f0; --text:#1a202c; --muted:#718096; }
* { box-sizing:border-box; margin:0; }
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
header { background:var(--primary); color:#fff; padding:14px 24px; font-size:18px; font-weight:600; }
nav { display:flex; gap:4px; background:var(--card); border-bottom:1px solid var(--border); padding:0 16px; }
nav button { border:0; background:none; padding:12px 18px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
nav button.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
main { padding:20px; max-width:1100px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:500; }
.pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; }
.pill.enabled,.pill.approved { background:#e6f6ec; color:#0a7a3d; }
.pill.pending { background:#fff6e0; color:#9a6b00; }
.pill.disabled,.pill.rejected { background:#fdeaea; color:#b32020; }
button.op { border:1px solid var(--border); background:#fff; border-radius:6px; padding:4px 12px; font-size:12.5px; cursor:pointer; margin-right:6px; }
button.op:hover { border-color:var(--primary); color:var(--primary); }
button.primary { background:var(--primary); color:#fff; border:0; border-radius:6px; padding:8px 16px; font-size:13.5px; cursor:pointer; }
input[type=text] { border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13.5px; width:420px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--muted); font-size:12.5px; }
pre { background:#f8fafc; padding:10px; border-radius:6px; font-size:12px; overflow:auto; max-height:240px; }
#toast { position:fixed; bottom:24px; right:24px; background:#1a202c; color:#fff; padding:10px 16px; border-radius:8px; display:none; font-size:13.5px; }
</style>
</head>
<body>
<header>self-agent 管理台</header>
<nav id="tabs">
  <button data-tab="skills" class="active">技能管理</button>
  <button data-tab="knowledge">知识库</button>
  <button data-tab="approvals">审批</button>
  <button data-tab="files">工作区文件</button>
</nav>
<main id="main"></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch(p, opt).then(async r => {
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
});
const toast = m => { const t=$("#toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none", 2600); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const views = {
async skills() {
  const {skills} = await api("/skills");
  return `<div class="card"><div class="row">
      <input type="text" id="ghUrl" placeholder="https://github.com/owner/repo[@tag]">
      <button class="primary" onclick="importGh()">从 GitHub 导入</button>
      <label class="op" style="padding:7px 14px">上传 zip<input type="file" hidden accept=".zip" onchange="uploadZip(this)"></label>
      <span class="muted">导入后默认 pending，审核通过才对会话生效</span></div></div>
    <div class="card"><table><tr><th>技能</th><th>描述</th><th>状态</th><th>来源</th><th>扫描</th><th>操作</th></tr>
    ${skills.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td class="muted">${esc(s.description||"").slice(0,42)}</td>
      <td><span class="pill ${esc(s.status)}">${esc(s.status)}</span></td>
      <td class="muted">${esc(s.source||"-")}${s.ref?"@"+esc(s.ref):""}</td>
      <td>${s.findings>0?`<a href="#" onclick="showFindings('${esc(s.name)}');return false">⚠ ${s.findings} 项</a>`:"✓ 0"}</td>
      <td>${s.status!=="enabled"?`<button class="op" onclick="setSkill('${esc(s.name)}','enabled')">启用</button>`:""}
          ${s.status==="enabled"?`<button class="op" onclick="setSkill('${esc(s.name)}','disabled')">禁用</button>`:""}
          ${s.status==="pending"?`<button class="op" onclick="setSkill('${esc(s.name)}','rejected')">拒绝</button>`:""}</td></tr>`).join("")}
    </table>${skills.length?"":'<p class="muted" style="padding:12px">暂无受管技能，从 GitHub 或 zip 导入。</p>'}</div>
    <div class="card" id="findings" style="display:none"></div>`;
},
async knowledge() {
  const {docs} = await api("/knowledge");
  return `<div class="card"><div class="row">
      <label class="op" style="padding:7px 14px">上传文档（pdf/docx/md/txt）<input type="file" hidden accept=".pdf,.docx,.md,.txt" onchange="uploadDoc(this)"></label>
      <input type="text" id="kbq" placeholder="检索测试…" style="width:280px">
      <button class="op" onclick="kbSearch()">检索</button></div></div>
    <div class="card"><table><tr><th>ID</th><th>文档</th><th>作用域</th><th>分块</th><th>日期</th><th></th></tr>
    ${docs.map(d=>`<tr><td>#${d.id}</td><td><b>${esc(d.filename)}</b></td><td>${esc(d.scope)}</td>
      <td>${d.chunks}</td><td class="muted">${esc(d.date)}</td>
      <td><button class="op" onclick="delDoc(${d.id})">删除</button></td></tr>`).join("")}
    </table>${docs.length?"":'<p class="muted" style="padding:12px">暂无文档。</p>'}</div>
    <div class="card" id="kbhits" style="display:none"></div>`;
},
async approvals() {
  const {approvals} = await api("/approvals?status=all");
  return `<div class="card"><table><tr><th>单号</th><th>动作</th><th>发起人</th><th>状态</th><th>时间</th><th>操作</th></tr>
    ${approvals.map(a=>`<tr><td>#${a.id}</td><td class="muted" style="max-width:380px">${esc(a.action).slice(0,120)}</td>
      <td>${esc(a.user||"?")}<span class="muted">(${esc(a.channel||"")})</span></td>
      <td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td><td class="muted">${esc(a.created_at).slice(0,19)}</td>
      <td>${a.status==="pending"?`<button class="op" onclick="decide(${a.id},true)">✅ 批准</button>
           <button class="op" onclick="decide(${a.id},false)">❌ 拒绝</button>`:""}</td></tr>`).join("")}
    </table>${approvals.length?"":'<p class="muted" style="padding:12px">暂无审批记录。</p>'}</div>`;
},
async files() {
  const {files} = await api("/files");
  return `<div class="card"><table><tr><th>路径</th><th>大小</th><th>修改时间</th><th></th></tr>
    ${files.map(f=>`<tr><td>${esc(f.path)}</td><td class="muted">${(f.size/1024).toFixed(1)} KB</td>
      <td class="muted">${new Date(f.mtime*1000).toLocaleString("zh-CN")}</td>
      <td><a href="/files/download?path=${encodeURIComponent(f.path)}">下载</a></td></tr>`).join("")}
    </table>${files.length?"":'<p class="muted" style="padding:12px">工作区暂无产物文件。</p>'}</div>`;
}};

let current = "skills";
async function render() {
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===current));
  try { $("#main").innerHTML = await views[current](); }
  catch (e) { $("#main").innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; }
}
$("#tabs").onclick = e => { if (e.target.dataset.tab) { current = e.target.dataset.tab; render(); } };

async function importGh() {
  try { const r = await api("/skills/import", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:$("#ghUrl").value})});
    toast(`已导入 ${r.imported.length} 个技能（pending）`); render(); } catch(e){ toast("导入失败："+e.message); }
}
async function uploadZip(inp) {
  const fd = new FormData(); fd.append("file", inp.files[0]);
  try { const r = await api("/skills/upload", {method:"POST", body:fd});
    toast(`已导入 ${r.imported.length} 个技能（pending）`); render(); } catch(e){ toast("上传失败："+e.message); }
}
async function setSkill(name, status) {
  try { await api(`/skills/${name}/status`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});
    toast(`${name} → ${status}`); render(); } catch(e){ toast(e.message); }
}
async function showFindings(name) {
  const {findings} = await api(`/skills/${name}/findings`);
  const el = $("#findings"); el.style.display="block";
  el.innerHTML = `<b>${esc(name)} 扫描发现</b><pre>${esc(JSON.stringify(findings,null,2))}</pre>`;
}
async function uploadDoc(inp) {
  const fd = new FormData(); fd.append("file", inp.files[0]);
  try { const r = await api("/knowledge/upload", {method:"POST", body:fd});
    toast(`已入库 ${r.chunks} 块（${r.mode} 模式）`); render(); } catch(e){ toast("上传失败："+e.message); }
}
async function delDoc(id) { await api(`/knowledge/${id}`, {method:"DELETE"}); toast("已删除"); render(); }
async function kbSearch() {
  const {hits} = await api(`/knowledge/search?q=${encodeURIComponent($("#kbq").value)}`);
  const el = $("#kbhits"); el.style.display="block";
  el.innerHTML = hits.length ? hits.map(h=>`<p><b>[${h.score}] ${esc(h.file)}#${h.seq}</b><br>
    <span class="muted">${esc(h.content).slice(0,180)}…</span></p>`).join("") : "无命中";
}
async function decide(id, approve) {
  try { await api(`/approvals/${id}/decision`, {method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({approve, channel:"admin", channel_user_id:"admin"})});
    toast(approve?"已批准，任务继续执行":"已拒绝"); render(); } catch(e){ toast(e.message); }
}
render();
setInterval(()=>{ if(current==="approvals") render(); }, 8000);
</script>
</body>
</html>
