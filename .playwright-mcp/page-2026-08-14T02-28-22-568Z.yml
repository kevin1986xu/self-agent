          - paragraph [ref=e497]: 汉川市是一个多宗教信仰地区。全市佛教、道教、天主教、基督教、伊斯兰教五教俱全，正式登记开放的宗教活动场所37个，其中天主教3个、基督教3个、佛教30个、道教1个。宗教教职人员43人。伊斯兰教只有信众无场所无教职人员。此外还有广泛的民间信仰。全市共有信教群众2万余人。宗教团体2个，宗教界代表人士中有孝感市政协委员1人，汉川市政协委员4人。
          - generic [ref=e498]:
            - heading "少数民族基本情况" [level=3] [ref=e499]
            - generic [ref=e500]:
              - link "编辑":
                - /url: /w/index.php?title=%E6%B1%89%E5%B7%9D%E5%B8%82&action=edit&section=13
          - paragraph [ref=e501]: 汉川市属少数民族杂散居住地区，共有土家族、回族、满族、朝鲜族、蒙古族、瑶族、傣族、黎族、侗族、东乡族、纳西族、京族、畬族、布依族、白族、彝族、锡伯族、独龙族、藏族、维吾尔族、佤族等21个少数民族，1194人，分布于27个乡、镇、农（养殖）场、办事处。少数民族人口占全市总人口的1.09‰。全市少数民族代表人士中有孝感市人大代表1人，孝感市政协委员1人，汉川市人大代表1人，汉川市政协委员4人。
