          - figure "明中期的汉川县，出自嘉靖《汉阳府志》（1546年）" [ref=e379]:
            - link [ref=e380] [cursor=pointer]:
              - /url: /w/index.php?title=File:%EF%BC%88%E5%98%89%E9%9D%96%EF%BC%89%E6%BC%A2%E9%99%BD%E5%BA%9C%E5%BF%97_-_%E5%98%89%E9%9D%96%E4%BA%8C%E5%8D%81%E4%BA%94%E5%B9%B4_(1546).pdf&page=16
          - paragraph [ref=e383]: 周代市域属郧国南境。春秋战国时，楚灭郧后遂为楚地。秦属南郡。汉代至晋代，均为江夏郡安陆县地。南北朝时期，宋为安陆郡地。梁至西魏间，梁安、魏安、汊川等郡先后在甑山设治，县境为其辖地。
          - paragraph [ref=e384]: 建县始于南北朝北周武帝保定元年，即公元561年，治甑山下，故名甑山县，先后属甑山郡、复州和沔阳郡。隋大业末废县为镇，并入汉阳县。621年，县恢复，移治泐山下，以汊水流经县境而改名汊川县，属淮南道。742年，改属汉阳郡。758年，复属沔州。826年，改属鄂州。958年，改属安州，移治金鼓城（今刘家隔）。960年，属荆湖北路，以竟陵义水流入县西，更名为义川县。977年，因避宋太宗赵光义讳，以汉水横贯县境，改名汉川县。1071年，废县为镇，属鄂州汉阳县。1086年，县恢复，隶汉阳军。1135年，县又废。1137年复置。元代，各地改设行中书省，汉川属湖广行中书省汉阳府。1285年，移县治于长城（今城关镇）。明代改制，设承宣布政使司，汉川属湖广布政使司汉阳府。1376年，汉阳府降为州，汉川改隶武昌府。1380年，复隶汉阳府。1664年，湖北、湖南分治，汉川隶湖北布政使司汉阳府。1912年，废府设道，汉川属江汉道。
          - paragraph [ref=e385]: 中国共产党领导的政权在汉川建立后，汉川几度出现国民党和共产党两种政权并存的局面。1949年5月汉川全境解放，国民党汉川县政府灭亡。同年7月，天汉、川汉两县爱国民主政府撤销，汉川县人民政府建立，属鄂中专区。同年8月，改属沔阳专区。1951年7月，沔阳专区撤销，隶属孝感专区。1959年11月，孝感专区撤销，划归武汉市。1961年5月，还属孝感专区。1970年专区改名地区后，汉川一直隶属孝感地区。1997年3月12日，经国务院批准，撤销汉川县，设立汉川市，以原汉川县行政区域为汉川市行政区域，由孝感市代管。
