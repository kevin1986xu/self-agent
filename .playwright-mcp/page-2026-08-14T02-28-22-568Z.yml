          - paragraph [ref=e389]:
            - text: 汉川市位于
            - link "汉江" [ref=e390] [cursor=pointer]:
              - /url: /wiki/%E6%B1%89%E6%B1%9F_(%E4%B8%AD%E5%9B%BD)
            - text: 下游，
            - link "江汉平原" [ref=e391] [cursor=pointer]:
              - /url: /wiki/%E6%B1%9F%E6%B1%89%E5%B9%B3%E5%8E%9F
            - text: 腹地。地跨东经113°22′～113°57′，北纬30°22′～30°51′之间。东与武汉市东西湖区和汉阳毗邻，西连天门，南邻仙桃，北与应城、云梦、孝南接壤。全市东西长55.6㎞，南北宽53.03㎞。汉川市地处江汉平原，地势平坦且较低洼，由西北向东南平缓倾斜，属平原湖区。由于汉江横贯全境，历经洪水漫流冲刷，形成汉江沿岸略高，中部低平，东南部有起伏的山丘，西北部边缘（汉北河以北）有湖滨隆起的岗地。海拔一般在25米左右，约为1600km2，占土地总面积96.4%（含湖泊、水系），东南部海拔稍高的低山丘陵面积约60km2，占土地总面积3.6%。我市地貌大体可划分为平原、低丘两种类型，其中以平原为主，它决定我市种植业在农业中的地位举足轻重。
          - paragraph [ref=e392]:
            - text: 汉川市属
            - link "亚热带季风气候" [ref=e393] [cursor=pointer]:
              - /url: /wiki/%E4%BA%9A%E7%83%AD%E5%B8%A6%E5%AD%A3%E9%A3%8E%E6%B0%94%E5%80%99
            - text: ，雨量充沛，气候温和，四季分明。年平均气温16.1℃，平均日照为1938.5小时，年平均降水量1198㎜，无霜期230天。
          - paragraph [ref=e394]: 汉川市成土母质，大部分为河流冲积物及湖泊沉淀物，分布在汉江两岸平原，部分第四纪黄土分布在垌冢、麻河岗地，少部分红砂岩、石英岩风化物分布在马鞍榔头、南河的低丘地带，整个耕地土壤分黄棕壤、潮土、水稻土三个土类。耕地经过历年的农事活动，熟化程度高，土层深厚，耕性良好。经土壤普查，全市土壤肥力分为四等：一级土壤占耕地38.1%、二级占38.9%、三级占21.7%、四级占1.3%，一、二级土壤占耕地面积约77%。土壤酸碱平均为7.8，中壤和轻壤占耕地的77.8%。全市矿产资源有高岭石、石灰石、河沙和岩盐等。
