          - paragraph [ref=e363]:
            - text: 汉川市位于
            - link "中国" [ref=e364] [cursor=pointer]:
              - /url: /wiki/%E4%B8%AD%E5%9B%BD
            - link "湖北省" [ref=e365] [cursor=pointer]:
              - /url: /wiki/%E6%B9%96%E5%8C%97%E7%9C%81
            - text: 中部偏东、
            - link "江汉平原" [ref=e366] [cursor=pointer]:
              - /url: /wiki/%E6%B1%9F%E6%B1%89%E5%B9%B3%E5%8E%9F
            - text: 腹地，紧邻“
            - link "九省通衢" [ref=e367] [cursor=pointer]:
              - /url: /wiki/%E4%B9%9D%E7%9C%81%E9%80%9A%E8%A1%A2
            - text: ”的
            - link "省会" [ref=e368] [cursor=pointer]:
              - /url: /wiki/%E7%9C%81%E4%BC%9A
            - text: 城市
            - link "武汉" [ref=e369] [cursor=pointer]:
              - /url: /wiki/%E6%AD%A6%E6%B1%89
            - text: ，因长江最大的支流汉江横贯境域而得名，素有“
            - link "鱼米之乡" [ref=e370] [cursor=pointer]:
              - /url: https://zh.wiktionary.org/wiki/%E9%B1%BC%E7%B1%B3%E4%B9%8B%E4%B9%A1
            - text: ”、“
            - link "江汉明珠" [ref=e371] [cursor=pointer]:
              - /url: /w/index.php?title=%E4%B8%AD%E5%9B%BD%E5%9C%B0%E5%90%8D%E5%88%AB%E7%A7%B0%E5%88%97%E8%A1%A8&action=edit&redlink=1
            - text: ”的美誉。属于单独的市直属湖北省级管理，全市面积1663平方公里，总人口90万人
            - superscript [ref=e372]:
              - link "[2]" [ref=e373] [cursor=pointer]:
                - /url: "#cite_note-:0-2"
            - text: ，是一座快速崛起的中国内陆新兴城市。先后被评为全国最具投资潜力中小城市百强县（市）、中国产业百强县（市）、全国“婚育新风进万家”先进县（市）、全国楹联文化城市、中国民间文化艺术之乡
            - superscript [ref=e374]:
              - link "[3]" [ref=e375] [cursor=pointer]:
                - /url: "#cite_note-3"
            - text: 。汉川地处江汉平原腹地，毗邻武汉，位于武汉城市圈核心圈层，是全省县域经济先进县（市），市人民政府驻仙女山街道文化路。
          - generic [ref=e376]:
